<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FT FLOW - Sistema de Gestão</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23052e16' width='100' height='100'/><text x='50' y='70' font-size='60' fill='%2310b981' text-anchor='middle' font-weight='bold'>FT</text></svg>">
<link rel="stylesheet" href="style.css?v=3">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#052e16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="logo-container">
      <div class="logo-circle">FT</div>
    </div>
    <h1>FT FLOW</h1>
    <p>Sistema de Gestão Empresarial</p>
    <div class="form-group">
      <input id="loginUser" placeholder="Usuário" value="admin">
      <input id="loginPass" type="password" placeholder="Senha" value="123">
      <button onclick="fazerLogin()" class="btn-login">Entrar</button>
    </div>
    <small>admin / 123 ou operador / 123</small>
  </div>
</div>

<!-- APP PRINCIPAL -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo-mini">FT</div>
      <b>FT FLOW</b>
    </div>
    <nav class="nav-menu">
      <button class="nav active" onclick="trocarTela('dashboard',this)">📊 Dashboard</button>
      <button class="nav" onclick="trocarTela('manutencoes',this)">🔧 Manutenções</button>
      <button class="nav" onclick="trocarTela('estoque',this)">📦 Estoque</button>
      <button class="nav" onclick="trocarTela('compras',this)">🛒 Compras</button>
      <button class="nav admin-only" onclick="trocarTela('cotacoes',this)">💰 Cotações</button>
      <button class="nav admin-only" onclick="trocarTela('recomendacoes',this)">📋 Recomendações</button>
      <button class="nav admin-only" onclick="trocarTela('adubacao',this)">🌱 Adubação</button>
      <button class="nav admin-only" onclick="trocarTela('relatorios',this)">📈 Relatórios</button>
      <button class="nav admin-only" onclick="trocarTela('fornecedores',this)">🏢 Fornecedores</button>
    </nav>
    <div class="userbox">
      <div id="userName" class="user-name"></div>
      <small id="userRole" class="user-role"></small>
      <button class="logout" onclick="location.reload()">Sair</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="header-title">
        <h2 id="pageTitle">Dashboard</h2>
        <p>Sistema interno de gestão operacional</p>
      </div>
      <div class="top-actions admin-only">
        <button class="bell-btn" onclick="abrirNotificacoes()">🔔 <span id="notifCount" class="notif-count hidden">0</span></button>
      </div>
    </header>
    <section id="content" class="content"></section>
  </main>
</div>

<!-- PAINEL DE NOTIFICAÇÕES -->
<div id="notifPanel" class="notif-panel hidden">
  <div class="notif-head">
    <h3>🔔 Notificações</h3>
    <button onclick="fecharNotificacoes()">×</button>
  </div>
  <button class="secondary" onclick="marcarTodasNotificacoes()">Marcar todas como lidas</button>
  <div id="notifList"></div>
</div>

<!-- MODAL: NOVA MANUTENÇÃO -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h3>Nova Manutenção</h3>
      <button onclick="fecharModal()">×</button>
    </div>
    <form id="formManutencao" onsubmit="salvarManutencao(event)">
      <div class="grid-2">
        <label>
          Solicitante
          <select name="solicitante" required>
            <option>Kleber</option>
            <option>Flávio</option>
            <option>Leomar</option>
            <option>Diana</option>
            <option>Dayana</option>
            <option>Outro</option>
          </select>
        </label>
        <label>
          Data
          <input name="data_ocorrencia" type="date" required>
        </label>
      </div>
      <div class="grid-2">
        <label>
          Tipo
          <select name="tipo" required>
            <option>Estufas</option>
            <option>Infraestrutura</option>
            <option>Tratores</option>
            <option>Implementos</option>
            <option>Equipamentos</option>
            <option>Máquinas</option>
            <option>Bombas e Motores</option>
          </select>
        </label>
        <label>
          Local/Item
          <input name="local_item" required>
        </label>
      </div>
      <label>
        Problema
        <textarea name="defeito" required></textarea>
      </label>
      <div class="grid-2">
        <label>
          Urgência
          <select name="urgencia" required>
            <option>Baixa (pode esperar)</option>
            <option>Média (prejudica o uso)</option>
            <option>Alta (parou a operação)</option>
          </select>
        </label>
        <label>
          Responsável
          <input name="responsavel">
        </label>
      </div>
      <label>
        Solução/Observação
        <textarea name="solucao"></textarea>
      </label>
      <div class="purchase-box">
        <label class="check">
          <input type="checkbox" id="precisaCompra" onchange="toggleCompra()">
          Necessita compra?
        </label>
        <div id="camposCompra" class="hidden grid-2">
          <label>Item<input name="item_compra"></label>
          <label>Quantidade<input name="quantidade_compra" type="number" value="1"></label>
          <label>Categoria<select name="categoria_compra">
            <option>Peças de manutenção</option>
            <option>Adubo</option>
            <option>Defensivo</option>
            <option>Embalagens</option>
            <option>Caixa 48</option>
            <option>Caixa 58</option>
            <option>Outros</option>
          </select></label>
          <label>Destino<input name="destino_compra" placeholder="Ex: Defensivo Vinhedo"></label>
        </div>
      </div>
      <button class="primary full">Salvar Manutenção</button>
    </form>
  </div>
</div>

<!-- MODAL: CONCLUIR MANUTENÇÃO -->
<div id="concluirModal" class="modal hidden">
  <div class="modal-card small-modal">
    <div class="modal-head">
      <h3>Concluir Manutenção</h3>
      <button onclick="fecharConcluir()">×</button>
    </div>
    <input type="hidden" id="concluirId">
    <label>
      Responsável pela execução
      <input id="concluirResponsavel" placeholder="Nome do responsável" required>
    </label>
    <label>
      Solução aplicada
      <textarea id="concluirSolucao" placeholder="Descreva o que foi feito" required></textarea>
    </label>
    <button class="primary full" onclick="salvarConclusao()">Concluir Manutenção</button>
  </div>
</div>

<!-- MODAL: ADICIONAR ESTOQUE -->
<div id="adicionarEstoqueModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h3>Adicionar Produto ao Estoque</h3>
      <button onclick="fecharAdicionarEstoque()">×</button>
    </div>
    <form id="adicionarEstoqueForm">
      <label>
        Nome do Produto
        <input id="estoqueNome" required>
      </label>
      <label>
        Categoria
        <select id="estoqueCategoria" required>
          <option>Embalagens</option>
          <option>Adubo</option>
          <option>Defensivo</option>
          <option>Peças</option>
          <option>Outros</option>
        </select>
      </label>
      <div class="grid-2">
        <label>
          Unidade
          <input id="estoqueUnidade" value="un" required>
        </label>
        <label>
          Quantidade
          <input id="estoqueQuantidade" type="number" value="0" required>
        </label>
      </div>
      <label>
        Quantidade Mínima
        <input id="estoqueMinimo" type="number" value="10" required>
      </label>
      <button type="button" class="primary full" onclick="salvarNovoEstoque()">Adicionar Produto</button>
    </form>
  </div>
</div>

<!-- MODAL: ADICIONAR COMPRA -->
<div id="adicionarCompraModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h3>Nova Compra</h3>
      <button onclick="fecharAdicionarCompra()">×</button>
    </div>
    <form id="adicionarCompraForm">
      <label>
        Item
        <input id="compraItem" required>
      </label>
      <label>
        Quantidade
        <input id="compraQuantidade" type="number" value="1" required>
      </label>
      <label>
        Valor Estimado (R$)
        <input id="compraValor" type="number" value="0" step="0.01" required>
      </label>
      <label>
        Categoria
        <select id="compraCategoria" required>
          <option>Peças</option>
          <option>Adubo</option>
          <option>Defensivo</option>
          <option>Embalagens</option>
          <option>Outros</option>
        </select>
      </label>
      <label>
        Destino
        <input id="compraDestino" required>
      </label>
      <small style="color: #666; display: block; margin-top: 10px;">💡 Compras abaixo de R$2.000 são aprovadas automaticamente</small>
      <button type="button" class="primary full" onclick="salvarNovaCompra()">Criar Compra</button>
    </form>
  </div>
</div>

<script src="app.js?v=3"></script>
</body>
</html>
